server:
  port: 8082

spring:
  application:
    name: limit-service
  
  datasource:
    url: jdbc:postgresql://localhost:5433/limit_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

limit:
  default:
    daily: 10000.00

logging:
  level:
    com.example.limit: DEBUG
